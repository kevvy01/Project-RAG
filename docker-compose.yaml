services:
  # --- SERVICE 1: n8n (Orkestrator RAG) ---
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.kevvy.my.id
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.kevvy.my.id/
      - GENERIC_TIMEZONE=Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n

  # --- SERVICE 2: WEBAPP (Node.js Backend & Frontend) ---
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: nodejs-webapp
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - n8n

  # --- SERVICE 3: CLOUDFLARE TUNNEL (Zero Trust) ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    network_mode: "host"
    command: tunnel run --token ${YOUR_TOKEN_HERE}

volumes:
  n8n_data:
